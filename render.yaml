envVarGroups:
  - name: parallels-shared
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: ALLOW_EPHEMERAL_MEDIA
        value: "false"
      - key: CLOUDINARY_URL
        sync: false
      - key: REQUIRE_CLOUDINARY_STORAGE
        value: "true"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: SEASHELL_NODE_NAME
        value: NODE_RENDER_FREE
      - key: SEASHELL_WORKER_NAME
        value: render-celery

services:
  - type: keyvalue
    name: parallels-redis
    plan: free
    region: singapore
    ipAllowList: []

  # Free demo: two Celery workers share the web service; uploads use Cloudinary.
  - type: web
    name: parallels-web
    runtime: python
    rootDir: mainProject
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && honcho start --procfile Procfile
    healthCheckPath: /
    envVars:
      - fromGroup: parallels-shared
      - key: DATABASE_URL
        fromDatabase:
          name: parallels-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parallels-redis
          property: connectionString

databases:
  - name: parallels-db
    databaseName: parallels
    plan: free
    region: singapore